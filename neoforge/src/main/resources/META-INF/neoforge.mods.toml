modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Vg34100/Minecraft-SleepCycle/issues"
license = "MIT"

[[mods]]
modId = "sleepcycle"
version = "${version}"
displayName = "Sleep Cycle"
authors = "VgLevelUp"
description = '''
Enhances sleeping with progressive time passage, healing, sleep effects and colored sleeping bags.
'''
${neoforge_icon_field} = "assets/sleepcycle/icon.png"

[features.sleepcycle]
javaVersion = "[${java_version},)"

[[dependencies.sleepcycle]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sleepcycle]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.sleepcycle]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "sleepcycle.mixins.json"

${neoforge_compat_mixins}
